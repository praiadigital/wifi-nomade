<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wi-Fi Nômade — Score de Trabalho Remoto | Praia Digital</title><meta name="description" content="Score de internet, coworkings e custo de vida para nômades digitais no litoral paulista."><style>body{font-family:system-ui,sans-serif;background:linear-gradient(160deg,#eef0fb,#f0fbf4);margin:0;padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #4a4e8c22}h1{color:#3d4291;font-size:1.5rem}select{width:100%;padding:.6rem;border:2px solid #dde0f0;border-radius:10px;font-size:1rem;margin-top:.8rem}table{width:100%;margin-top:1rem;border-collapse:collapse;font-size:.92rem}td,th{padding:.45rem;border-bottom:1px solid #eee;text-align:left}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#4a4e8c;margin:0 .5rem;text-decoration:none}.pill{display:inline-block;padding:.15rem .6rem;border-radius:999px;color:#fff;font-weight:700;font-size:.8rem}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/coworking-praia">Coworking Praia</a> · <a href="https://praia.digital/home-office-praia">Home Office Praia</a> · <a href="https://praia.digital/nomade-digital">Nômade Digital</a></nav><div class="card"><h1>📡 Wi-Fi Nômade</h1><p>Score de trabalho remoto por cidade do litoral paulista (internet, coworking, custo).</p><select id="c" onchange="render()"><option value="">Ranking geral</option><option value="net">Melhor internet</option><option value="custo">Menor custo</option><option value="cw">Mais coworkings</option></select><div id="tbl"></div></div><script>const dados=[{c:'Santos',net:95,cw:9,custo:62},{c:'Guarujá',net:88,cw:6,custo:58},{c:'São Vicente',net:82,cw:4,custo:74},{c:'Praia Grande',net:85,cw:5,custo:78},{c:'Ubatuba',net:74,cw:5,custo:66},{c:'Caraguatatuba',net:72,cw:4,custo:72},{c:'São Sebastião',net:68,cw:3,custo:60},{c:'Bertioga',net:64,cw:2,custo:76},{c:'Ilhabela',net:58,cw:3,custo:48},{c:'Peruíbe',net:60,cw:2,custo:82}];function score(x){return Math.round(x.net*.45+x.cw*5+x.custo*.25)}function cor(s){return s>=75?'#3ba55d':s>=65?'#e8a13c':'#d9534f'}function render(){const k=document.getElementById('c').value;let d=[...dados];if(k)d.sort((a,b)=>b[k]-a[k]);else d.sort((a,b)=>score(b)-score(a));document.getElementById('tbl').innerHTML='<table><tr><th>Cidade</th><th>Internet</th><th>Coworkings</th><th>Custo</th><th>Score</th></tr>'+d.map(x=>`<tr><td><b>${x.c}</b></td><td>${x.net}</td><td>${x.cw}</td><td>${x.custo}</td><td><span class="pill" style="background:${cor(score(x))}">${score(x)}</span></td></tr>`).join('')+'</table><p style="margin-top:1rem;font-size:.85rem">💡 Escolheu a cidade? Veja o custo da mudança no <a href="https://praia.digital/custo-mudanca">Custo da Mudança</a>.</p>'}render()</script></body></html>
